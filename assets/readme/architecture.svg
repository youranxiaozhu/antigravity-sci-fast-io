<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sci Fast IO v2.0 System Architecture Blueprint</title>
  <desc id="desc">Sci Fast IO v2.0 四层科研加速与防爆架构蓝图：任务分级调度、PreToolUse 44ms 字节与命令筛网、双轨执行引擎（免审白名单与单轮合并计算）、以及上下文净空闭环。</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="rose-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#94A3B8"/>
    </marker>
    <marker id="arr-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#FB7185"/>
    </marker>
  </defs>

  <!-- Dark Blueprint Canvas -->
  <rect width="1200" height="720" rx="20" fill="url(#bg-grad)"/>
  <rect width="1200" height="720" rx="20" fill="url(#grid)" opacity="0.75"/>
  <rect x="16" y="16" width="1168" height="688" rx="14" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Top Telemetry Header Bar -->
  <g class="sans">
    <text x="48" y="56" class="mono" font-size="12.5" letter-spacing="2" fill="#38BDF8">SCI-FAST-IO // SYSTEM TELEMETRY &amp; EXECUTION TOPOLOGY v2.0</text>
    <text x="48" y="92" font-size="28" font-weight="800" fill="#F8FAFC">三层协同科研工作流架构（硬筛网 · 双通道执行 · 上下文隔离）</text>
  </g>

  <!-- Status Pills Top Right -->
  <g class="mono" transform="translate(796, 44)">
    <rect x="0" y="0" width="172" height="30" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="86" y="20" text-anchor="middle" font-size="12.5" fill="#A7F3D0">ALLOWLIST: &lt;100ms</text>
    <rect x="184" y="0" width="172" height="30" rx="6" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="270" y="20" text-anchor="middle" font-size="12.5" fill="#BAE6FD">GUARD P50: 43.9ms</text>
  </g>

  <line x1="48" y1="116" x2="1152" y2="116" stroke="#1E293B" stroke-width="1.5"/>

  <!-- STAGE 1: Dispatcher & Context Router -->
  <g class="sans">
    <rect x="48" y="154" width="252" height="260" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.8"/>
    <rect x="48" y="154" width="252" height="38" rx="12" fill="#1E293B"/>
    <text x="66" y="178" class="mono" font-size="13" font-weight="700" fill="#38BDF8">STAGE 01 // ORCHESTRATOR</text>
    <text x="66" y="220" font-size="19" font-weight="700" fill="#F1F5F9">智能规划与并行聚合</text>
    <text x="66" y="245" font-size="13.5" fill="#94A3B8">消除“读一页想一轮”的串行空转</text>

    <rect x="64" y="264" width="220" height="40" rx="7" fill="#132038" stroke="#1E3A5F" stroke-width="1"/>
    <text x="76" y="289" font-size="13.5" fill="#E2E8F0">① 先 1 条检索定位，下轮并行读齐</text>

    <rect x="64" y="312" width="220" height="40" rx="7" fill="#132038" stroke="#1E3A5F" stroke-width="1"/>
    <text x="76" y="337" font-size="13.5" fill="#E2E8F0">② 同轮附带 1–2 句进度，零空回合</text>

    <rect x="64" y="360" width="220" height="40" rx="7" fill="#132038" stroke="#1E3A5F" stroke-width="1"/>
    <text x="76" y="385" font-size="13.5" fill="#7DD3FC">③ 陌生跨模块调研 → research 子代理</text>
  </g>

  <!-- Connector Stage 1 -> Stage 2 -->
  <path d="M300 284 H348" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arr-slate)"/>

  <!-- STAGE 2: PreToolUse Guard Sieve -->
  <g class="sans">
    <rect x="356" y="154" width="292" height="260" rx="12" fill="url(#cyan-glow)" stroke="#0EA5E9" stroke-width="2"/>
    <rect x="356" y="154" width="292" height="38" rx="12" fill="#0C4A6E"/>
    <text x="374" y="178" class="mono" font-size="13" font-weight="700" fill="#7DD3FC">STAGE 02 // PRETOOLUSE SIEVE</text>
    <text x="374" y="220" font-size="19" font-weight="700" fill="#F8FAFC">本地字节与命令硬筛网</text>
    <text x="374" y="243" class="mono" font-size="12.5" fill="#38BDF8">pretool_guard.py · 非阻塞管道帧解析</text>

    <text x="374" y="274" font-size="13.5" fill="#E2E8F0">• <tspan fill="#FCA5A5" font-weight="700">二进制零容忍</tspan>：.npz .pt .h5ad .nii.gz .zarr</text>
    <text x="374" y="301" font-size="13.5" fill="#E2E8F0">• <tspan fill="#FDE68A" font-weight="700">文本三级门禁</tspan>：≤32KB 直通 / 32K–2M 限 80 行</text>
    <text x="374" y="328" font-size="13.5" fill="#E2E8F0">• <tspan fill="#FDE68A" font-weight="700">超宽表拦截</tspan>：自动阻断单行 &gt;8KB 表达矩阵</text>
    <text x="374" y="355" font-size="13.5" fill="#E2E8F0">• <tspan fill="#FCA5A5" font-weight="700">Notebook 防爆</tspan>：&gt;32KB 阻断 base64 图片灌入</text>
    <text x="374" y="382" font-size="13.5" fill="#E2E8F0">• <tspan fill="#FCA5A5" font-weight="700">危险 grep 拒止</tspan>：拦截无过滤根目录裸扫</text>
  </g>

  <!-- Deflection Path Downward (DENY -> sci-eda) -->
  <path d="M502 414 V466" fill="none" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arr-rose)"/>
  <g class="sans">
    <rect x="356" y="474" width="292" height="114" rx="12" fill="url(#rose-glow)" stroke="#F43F5E" stroke-width="1.8"/>
    <text x="374" y="502" class="mono" font-size="12.5" font-weight="700" fill="#FDA4AF">INTERCEPTED // ZERO CONTEXT POLLUTION</text>
    <text x="374" y="528" font-size="16.5" font-weight="700" fill="#FFF1F2">高危读取即时阻断并重定向</text>
    <text x="374" y="553" font-size="13.5" fill="#FECDD3">返回精确替代指引，引导按需激活</text>
    <text x="374" y="574" class="mono" font-size="13" font-weight="700" fill="#38BDF8">→ skills/sci-eda/SKILL.md</text>
  </g>
  <!-- Redirect arrow from Intercepted box into Stage 3B -->
  <path d="M648 531 H686 V456 H716" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-cyan)"/>

  <!-- Split Connectors Stage 2 -> Stage 3A & Stage 3B -->
  <path d="M648 240 H686 V218 H716" fill="none" stroke="#34D399" stroke-width="2.4" marker-end="url(#arr-emerald)"/>
  <path d="M648 330 H686 V422 H716" fill="none" stroke="#38BDF8" stroke-width="2.4" marker-end="url(#arr-cyan)"/>

  <!-- STAGE 3A: Zero-Review Allowlist Express Channel -->
  <g class="sans">
    <rect x="724" y="144" width="428" height="162" rx="12" fill="url(#emerald-glow)" stroke="#10B981" stroke-width="2"/>
    <rect x="724" y="144" width="428" height="36" rx="12" fill="#064E3B"/>
    <text x="742" y="167" class="mono" font-size="12.5" font-weight="700" fill="#6EE7B7">CHANNEL A // ZERO-REVIEW EXPRESS (&lt;0.1s)</text>
    <text x="742" y="206" font-size="18.5" font-weight="700" fill="#ECFDF5">免审白名单直通检索通道</text>
    <text x="742" y="232" class="mono" font-size="13" fill="#A7F3D0">grep -Rn -I | head · ls -lh · wc -l · jq · git diff</text>
    <text x="742" y="260" font-size="13.5" fill="#D1FAE5">• 裸命令 + 单管道直通，省去每次 2–5s 云端小模型排队审查</text>
    <text x="742" y="285" font-size="13.5" fill="#D1FAE5">• 智能逃生阀：万级文件深层松散目录允许切换过滤版 rg / fd</text>
  </g>

  <!-- STAGE 3B: Batched Compute, Plotting & Sci-EDA -->
  <g class="sans">
    <rect x="724" y="336" width="428" height="252" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <rect x="724" y="336" width="428" height="36" rx="12" fill="#0C4A6E"/>
    <text x="742" y="359" class="mono" font-size="12.5" font-weight="700" fill="#7DD3FC">CHANNEL B // BATCHED COMPUTE &amp; SCI-EDA</text>
    <text x="742" y="398" font-size="18.5" font-weight="700" fill="#F0F9FF">单轮合并计算、绘图编译与三步验证</text>
    <text x="742" y="424" class="mono" font-size="13" fill="#7DD3FC">python3 (sci-eda) · uv · Rscript · xelatex &amp;&amp; lint</text>
    <text x="742" y="454" font-size="13.5" fill="#E2E8F0">• <tspan fill="#38BDF8" font-weight="700">Sci-EDA 模板</tspan>：1 次运行输出表格/h5ad/权重维度与缺失率</text>
    <text x="742" y="481" font-size="13.5" fill="#E2E8F0">• <tspan fill="#38BDF8" font-weight="700">编译校验合一</tspan>：绘图/LaTeX 编译合并执行，| tail -n 30 截断噪音</text>
    <text x="742" y="508" font-size="13.5" fill="#E2E8F0">• <tspan fill="#38BDF8" font-weight="700">替换三步闭环</tspan>：核对命中数 → 最小修改 → git diff 保护引用键</text>
    <text x="742" y="535" font-size="13.5" fill="#E2E8F0">• <tspan fill="#34D399" font-weight="700">真实性红线</tspan>：严禁估算/编造 p 值、误差棒、实验指标与 DOI</text>
    <text x="742" y="562" font-size="13.5" fill="#94A3B8">• 日常调试 ≤1,500 字结论先行；论文正文与审稿报告完整展开</text>
  </g>

  <!-- Clean Return Telemetry Bus at Bottom -->
  <path d="M938 588 V644 H174 V422" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-slate)"/>
  <g class="sans">
    <rect x="330" y="624" width="500" height="38" rx="19" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <text x="580" y="648" text-anchor="middle" font-size="13.5" font-weight="600" fill="#E2E8F0">结构化高信噪比摘要回流主模型 · 避免上下文膨胀与 5 分钟流超时</text>
  </g>
</svg>
